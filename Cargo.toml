[package]
name = "lowcheck_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "低模质量检查插件的 Rust 内核"
license = "MIT"
publish = false

[lib]
name = "lowcheck_core"
path = "src/lib.rs"
# cdylib 供 Python 以扩展模块形式加载；rlib 供 Rust 侧测试与集成使用
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["abi3-py38"], optional = true }

[features]
default = ["python"]
# 构建 Blender 扩展时启用：使用 CPython 稳定 ABI（abi3-py38），
# 不链接 libpython，Python 符号由宿主解释器在加载时提供。
python = ["dep:pyo3", "pyo3/extension-module"]

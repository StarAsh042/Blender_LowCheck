name: CI

on:
  push:
    branches: [main, "rebuild/*"]
  pull_request:

jobs:
  rust:
    name: Rust 内核门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: 格式
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: 单元测试
        run: cargo test --all
      - name: Release 构建
        run: cargo build --release

  lint:
    name: Python 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff
      - run: ruff check .

  blender:
    name: Blender 侧测试
    runs-on: ubuntu-latest
    needs: [rust, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: 安装 Blender 3.4
        run: |
          curl -sSL -o /tmp/blender.tar.xz \
            https://download.blender.org/release/Blender3.4/blender-3.4.1-linux-x64.tar.xz
          tar -xf /tmp/blender.tar.xz -C /opt
          echo "/opt/blender-3.4.1-linux-x64" >> "$GITHUB_PATH"

      - name: 构建 Rust 内核扩展
        run: python3 tools/build_rust.py

      - name: 单元测试 + 端到端 + 回归 + 一致性
        run: |
          blender --background --factory-startup --python-exit-code 1 \
            --python tests/run_tests.py

      - name: 打包
        run: python3 tools/build_addon.py
